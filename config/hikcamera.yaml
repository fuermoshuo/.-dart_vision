# 海康相机配置
camera:
  exposuretime: 3000.0         # 曝光时间（微秒）。绿灯闪烁，建议短曝光避免过曝拖影
  gain: 16.0                   # 增益
  transfer_latency_ms: 1.5     # 传输延迟（毫秒）
  frame_rate: 0                # 采集帧率上限（fps），0 = 不修改相机当前设置。
                               # USB 2.0 全分辨率会吃满带宽导致周期性断流，可尝试 15~20。

# 相机标定（内参）
# 说明：本模块只需要 fx / cx 把像素偏移换算成水平角度，不需要手眼标定和 PnP。
#       请用棋盘格标定得到你自己的 camera_matrix / distort_coeffs，替换下面占位值。
calibration:
  image_width: 1440            # 图像宽度（像素），用于归一化水平误差
  camera_matrix: [2332.0050467636815, 0, 725.5685014245757,
                  0, 2334.9472759618193, 549.9154647263636,
                  0, 0, 1]
  distort_coeffs: [-0.4771792900696904, 0.3148366842233517,
                   -0.00037468013582780567, -0.00047277245616290285, 0]
