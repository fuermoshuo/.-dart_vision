# ============================================================================
# 飞镖视觉主配置
# ============================================================================
dart_vision:
  # ---- 绿色圆形检测 ----
  detector:
    debug: true                # 是否打开调试显示窗口
    # HSV 绿色阈值（OpenCV 范围：H 0~179, S 0~255, V 0~255）
    # 若绿灯颜色偏黄/偏青，优先调 hue_low / hue_high
    hue_low: 35
    hue_high: 85
    sat_low: 60                # 饱和度下限，过滤白墙等低饱和区域
    sat_high: 255
    val_low: 60                # 亮度下限，过滤暗背景
    val_high: 255
    # 形态学去噪核大小（奇数）
    morph_kernel_size: 3
    # 轮廓过滤
    # 只靠"绿色 + 圆度"会被绿色垃圾桶、招牌、屏幕里的绿色物体干扰。
    # 下面几个判据共同限定"小而亮、饱和、近似实心圆"的灯。
    min_area: 150              # 最小面积（像素²）
    max_area: 20000            # 最大面积（像素²），排除大面积绿色背景
    min_circularity: 0.10      # 圆度下限（形状主要由填充率/长宽比把关）
    max_aspect_ratio: 2.2      # 外接椭圆长短轴比上限（越接近 1 越圆）
    min_fill: 0.30             # 填充率 area/(πr²)，排除细长/镂空的绿色区域
    min_mean_sat: 120          # 轮廓内平均饱和度下限，排除灰绿/浅绿
    min_mean_val: 95           # 轮廓内平均亮度下限，排除暗绿色物体
    # 灯芯：过曝时核心会变白（S 很低），所以只在绿环内部按 V 找高亮核心
    core_val_min: 240          # 灯芯最低亮度，灯偏暗时降低
    core_max_sat: 90           # 灯芯最高饱和度：光晕是绿色(S高)，白核 S 低
    core_min_area: 50          # 灯芯最小面积（像素²）
    core_min_radius: 8         # 灯芯最小半径（像素）
    core_green_ring_min: 0.60  # 小核的绿环占比下限（排除普通白灯）
    big_core_radius: 25        # 半径 >= 该值按"大核"处理
    big_core_ring_min: 0.35    # 大核的绿环占比下限；过曝严重、偶发漏检时可尝试 0.20

  # ---- 目标选择 + 粗瞄准锁定 ----
  track:
    debug: true                  # 是否弹出 DartAim 瞄准状态窗口（不影响检测窗口）
    # 串口没收到目标选择时的默认目标：0=待机, 1=前哨站(左), 2=基地(右)
    default_target: 1
    # 粗对准：|target_yaw| 进入该角度并连续 align_frames 帧后锁定（HOLD）
    # 0.3° 约对应 15~20m 处 10px 左右，约 1.5 个灯直径；手测可放宽到 0.5
    align_tolerance_deg: 0.3
    align_frames: 5
    # 只剩一个灯时，用上次位置匹配前哨站/基地身份的最大偏差（相对图像宽）
    role_match_norm: 0.15
    max_lost_ms: 500             # 超过该时间没有任何灯，清空身份位置记忆
    detect_hold_ms: 300          # 选中目标短暂丢失时，继续沿用上一次角度的时间，避免 found 抖动
    yaw_sign: 1.0                # yaw 符号：若飞镖架转反了，改为 -1.0
    swap_sides: false            # 相机左右装反时改为 true
    hold_enable: false            # 测试云台连续跟随时设为 false（永不进入 HOLD）
